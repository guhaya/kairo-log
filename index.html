<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1116">
<meta name="robots" content="noindex, nofollow">
<title>KAIRO · Workout log & Ripped 90 tracker</title>
<style>
  :root {
    --bg: #0e1116;
    --surface: #171c24;
    --card: #1d2430;
    --card-2: #232b39;
    --text: #eef1f6;
    --muted: #8b95a8;
    --faint: #5c6678;
    --accent: #3dbe9a;
    --accent-dim: #1f6f5c;
    --accent-bg: #15352e;
    --warn: #e6b84d;
    --danger: #e85d5d;
    --line: #2a3340;
    --input: #10141b;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { min-height: 100dvh; min-height: 100vh; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  input, textarea, select { font-size: 16px; } /* prevent iOS zoom */
  .wrap { max-width: 520px; margin: 0 auto; padding: calc(16px + var(--safe-t)) 16px calc(120px + var(--safe-b)); }

  /* Unlock */
  #unlock {
    min-height: 100dvh; min-height: 100vh;
    display: flex; flex-direction: column; justify-content: center;
    padding: 32px 24px calc(40px + var(--safe-b));
    max-width: 420px; margin: 0 auto;
  }
  #unlock h1 { font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; font-weight: 700; }
  #unlock h2 { font-size: 28px; margin: 0 0 8px; font-weight: 650; letter-spacing: -0.03em; }
  #unlock p { color: var(--muted); margin: 0 0 28px; line-height: 1.45; }
  #unlock .row { display: flex; gap: 10px; }
  #passcode {
    flex: 1; background: var(--input); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 16px; outline: none; letter-spacing: 0.12em;
  }
  #passcode:focus { border-color: var(--accent); }
  #unlock-btn, #save-btn, .btn-primary {
    background: var(--accent); color: #06221b; font-weight: 700; border: 0;
    border-radius: 14px; padding: 16px 20px; min-height: 52px;
  }
  #unlock-btn:active, #save-btn:active { transform: scale(0.98); }
  .err { color: var(--danger); font-size: 14px; margin-top: 12px; min-height: 1.3em; }

  /* Header */
  header.app {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 18px;
  }
  header.app .brand { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  header.app .sub { color: var(--muted); font-size: 13px; }
  header.app button.link { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 8px 0; }

  /* Session picker */
  .seg {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px;
  }
  .seg.legacy { grid-template-columns: auto 1fr 1fr 1fr; align-items: center; gap: 6px; margin-top: -4px; }
  .seg.legacy .lbl { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; padding-right: 2px; }
  .seg.legacy button { min-height: 34px; padding: 6px 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); border-radius: 10px; }
  .seg.legacy button.on { color: var(--accent); }
  .seg button {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 8px; font-weight: 650; position: relative; min-height: 52px;
  }
  .seg button.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .seg button .chip {
    display: none; position: absolute; top: -8px; right: 6px;
    background: var(--accent); color: #06221b; font-size: 10px; font-weight: 800;
    letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 2px 6px;
  }
  .seg button.suggested .chip { display: inline; }

  .meta {
    display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end;
    margin-bottom: 8px;
  }
  .field label { display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .field input[type="date"] {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 12px; width: 100%; color-scheme: dark;
  }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 18px; line-height: 1.4; }
  .hint strong { color: var(--text); font-weight: 600; }

  /* Exercise cards */
  .ex {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 14px 12px; margin-bottom: 12px;
  }
  .ex-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
  .ex-name { font-weight: 650; font-size: 15.5px; line-height: 1.3; letter-spacing: -0.01em; }
  .ex-meta { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
  .ex-meta .tgt { color: var(--accent); font-weight: 600; }
  .set {
    display: grid; grid-template-columns: 48px 1fr 16px 1fr; gap: 8px; align-items: center;
    margin-bottom: 8px;
  }
  .set .n { color: var(--faint); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
  .set .inp {
    display: flex; align-items: center; background: var(--input); border: 1px solid var(--line);
    border-radius: 10px; padding: 0 10px; min-height: 46px;
  }
  .set .inp input {
    flex: 1; background: transparent; border: 0; outline: none; width: 100%;
    min-width: 0; padding: 10px 0; font-variant-numeric: tabular-nums; font-weight: 600;
  }
  .set .inp span { color: var(--faint); font-size: 11px; font-weight: 700; margin-left: 4px; letter-spacing: 0.04em; }
  .set .times { color: var(--faint); text-align: center; font-weight: 700; }
  .ex-notes {
    width: 100%; background: var(--input); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; resize: none; min-height: 40px; margin-top: 4px;
  }

  /* Energy / notes */
  .block { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 16px 0; }
  .block h3 { margin: 0 0 12px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .slider-row { display: grid; grid-template-columns: 88px 1fr 36px; gap: 10px; align-items: center; margin-bottom: 10px; }
  .slider-row label { font-size: 14px; }
  .slider-row input[type="range"] { width: 100%; accent-color: var(--accent); }
  .slider-row .val { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; color: var(--accent); }
  .slider-row input[type="range"].empty + .val, .val.off { color: var(--faint); }
  #session-notes {
    width: 100%; background: var(--input); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; min-height: 72px; resize: vertical;
  }

  /* Sticky save */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    padding: 16px 16px calc(16px + var(--safe-b));
    z-index: 20;
  }
  .dock-inner { max-width: 520px; margin: 0 auto; display: flex; gap: 10px; }
  #save-btn { flex: 1; font-size: 16px; }
  #save-btn:disabled { opacity: 0.5; cursor: default; }
  .status { text-align: center; font-size: 13px; margin-top: 8px; color: var(--muted); }
  .status.ok { color: var(--accent); }
  .status.bad { color: var(--danger); }

  /* History */
  .hist { margin-top: 8px; }
  .hist h3 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 20px 0 10px; }
  .hist-item {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px;
  }
  .hist-item .when { font-weight: 650; }
  .hist-item .sum { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .toast {
    display: none; position: fixed; top: calc(16px + var(--safe-t)); left: 50%; transform: translateX(-50%);
    background: var(--accent-bg); border: 1px solid var(--accent); color: var(--accent);
    padding: 10px 16px; border-radius: 12px; font-weight: 650; z-index: 40; white-space: nowrap;
  }
  .hidden { display: none !important; }
  /* v2: clearer set entry */
  .ex.has-err { border-color: var(--danger); }
  .ex-head .ex-name { flex: 1; }
  .ex-tools { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 10px; }
  .mini {
    background: var(--surface); border: 1px solid var(--line); color: var(--muted);
    border-radius: 999px; font-size: 12px; font-weight: 650; padding: 6px 10px; min-height: 30px;
  }
  .mini:active { transform: scale(0.97); }
  .ex-last { font-size: 12.5px; color: var(--muted); margin: -4px 0 8px; }
  .ex-last b { color: var(--text); font-weight: 650; }
  .ex-last .warnt { color: var(--warn); font-weight: 650; }
  .set-head {
    display: grid; grid-template-columns: 48px 1fr 16px 1fr; gap: 8px;
    font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    font-weight: 700; margin-bottom: 4px;
  }
  .set-head div:nth-child(2), .set-head div:nth-child(4) { padding-left: 11px; }
  .set .inp input::placeholder { color: #4a5363; font-style: italic; font-weight: 500; opacity: 1; }
  .set .inp input { color: #ffffff; font-weight: 750; font-size: 17px; }
  .set .inp.filled { border-color: #3a4a5c; background: #141b25; }
  .set .inp.auto input { color: #b9c3d3; }
  .set .inp.bad { border-color: var(--danger); background: #2a1517; }
  .set .inp span.u { color: var(--muted); font-size: 11px; font-weight: 700; margin-left: 4px; letter-spacing: 0.02em; white-space: nowrap; }
  .set.done .n { color: var(--accent); font-size: 15px; }
  .set .n { white-space: nowrap; }
  .set.done .inp { border-color: var(--accent-dim); }
  .set-msg { font-size: 12.5px; margin: -4px 0 8px 56px; line-height: 1.35; }
  .set-msg.bad { color: var(--danger); }
  .set-msg.warn { color: var(--warn); }
  .banner {
    border-radius: 12px; padding: 10px 12px; margin: 0 0 14px; font-size: 13.5px; line-height: 1.4;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
  }
  .banner.edit { border-color: var(--warn); background: #2b2412; }
  .banner.ok { border-color: var(--accent); background: var(--accent-bg); color: #c9f2e5; }
  .banner.bad { border-color: var(--danger); background: #2a1517; color: #ffd6d6; }
  .banner button { margin-left: 6px; }
  .banner ul { margin: 6px 0 0 18px; padding: 0; }
  .hist-item { display: block; width: 100%; text-align: left; color: var(--text); }
  .hist-item .row1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hist-item .edit { color: var(--accent); font-size: 13px; font-weight: 650; }
  .hist-item .sets { color: var(--muted); font-size: 12.5px; margin-top: 6px; line-height: 1.45; }
  .badge { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; border-radius: 999px; padding: 2px 7px; margin-left: 6px; }
  .badge.check { background: #3a2e10; color: var(--warn); border: 1px solid var(--warn); }
  .dock .status { min-height: 1.2em; }
  /* Ripped 90 tracker */
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: -6px 0 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
  .tabs button { background: none; border: 0; border-radius: 10px; padding: 10px 4px; font-size: 13.5px; font-weight: 650; color: var(--muted); min-height: 40px; }
  .tabs button.on { background: var(--accent-bg); color: var(--accent); }
  .testbar { background: #2b2412; border: 1px solid var(--warn); color: var(--warn); border-radius: 12px; padding: 8px 12px; font-size: 12.5px; font-weight: 650; margin-bottom: 12px; }
  .tk-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .tk-card h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .tk-card .big { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .tk-card .sub { color: var(--muted); font-size: 13px; margin-top: 2px; line-height: 1.4; }
  .tk-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .tk-grid > *, .tk-f, .tk-f .inp { min-width: 0; }
  .tk-f input[type=time] { width: 100%; }
  .tk-f label { display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .tk-f .inp { display: flex; align-items: center; background: var(--input); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; min-height: 46px; }
  .tk-f .inp.bad { border-color: var(--danger); background: #2a1517; }
  .tk-f .inp.filled { border-color: #3a4a5c; background: #141b25; }
  .tk-f input, .tk-f select { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; padding: 10px 0; color: #fff; font-weight: 700; font-variant-numeric: tabular-nums; color-scheme: dark; }
  .tk-f select option { background: var(--card); }
  .tk-f input::placeholder { color: #4a5363; font-style: italic; font-weight: 500; }
  .tk-f .u { color: var(--muted); font-size: 11px; font-weight: 700; margin-left: 4px; white-space: nowrap; }
  .tk-f .msg { font-size: 12px; color: var(--danger); min-height: 0; margin-top: 4px; line-height: 1.3; }
  .tk-full { grid-column: 1 / -1; }
  .pick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .pick.yn { grid-template-columns: repeat(3, 1fr); }
  .pick button { background: var(--input); border: 1px solid var(--line); border-radius: 10px; min-height: 42px; font-weight: 700; color: var(--muted); }
  .pick button.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .tk-notes { width: 100%; background: var(--input); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-height: 64px; resize: vertical; }
  .tk-save { width: 100%; margin-top: 12px; font-size: 16px; }
  .tk-save:disabled { opacity: 0.5; }
  .tk-list .hist-item { cursor: pointer; }
  .kv { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 10px; font-size: 13.5px; align-items: baseline; }
  .kv .k { color: var(--muted); }
  .kv .v { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .kv .t { color: var(--faint); font-size: 12px; text-align: right; white-space: nowrap; }
  .ok { color: var(--accent) !important; }
  .warnc { color: var(--warn) !important; }
  .nd { color: var(--faint) !important; font-weight: 500 !important; font-style: italic; }
  .chart { width: 100%; height: auto; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th { text-align: left; color: var(--muted); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; padding: 0 6px 6px 0; }
  .tbl td { padding: 7px 6px 7px 0; border-top: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; }
  .tbl td.r, .tbl th.r { text-align: right; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; border: 1px solid var(--line); color: var(--muted); margin: 2px 4px 2px 0; }
  .pill.next { border-color: var(--accent); color: var(--accent); }
  .pill.done { color: var(--faint); text-decoration: line-through; }
  .src { color: var(--faint); font-size: 11px; font-weight: 600; }
</style>
</head>
<body>
<div id="toast" class="toast"></div>

<section id="unlock">
  <h1>KAIRO</h1>
  <h2>Workout log</h2>
  <p>Enter your passcode to log today’s session. Your training data stays private.</p>
  <div class="row">
    <input id="passcode" type="password" inputmode="text" autocomplete="current-password" autocapitalize="off" spellcheck="false" placeholder="Passcode" enterkeyhint="go">
    <button type="button" id="unlock-btn">Open</button>
  </div>
  <div class="err" id="unlock-err"></div>
</section>

<section id="app" class="hidden">
  <div class="wrap">
    <header class="app">
      <div>
        <div class="brand">KAIRO</div>
        <div class="sub">Workout log · Ripped 90 tracker</div>
      </div>
      <button type="button" class="link" id="lock-btn">Lock</button>
    </header>

    <div class="testbar hidden" id="testbar">TEST MODE · check-ins saved here are test rows and never reach the planner</div>
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="workout">Workout</button>
      <button type="button" data-tab="daily">Daily</button>
      <button type="button" data-tab="weekly">Weekly</button>
      <button type="button" data-tab="progress">Progress</button>
    </nav>

    <div id="tab-workout">

    <div class="seg" id="seg"></div>
    <div class="seg legacy hidden" id="seg-legacy"></div>

    <div class="meta">
      <div class="field">
        <label for="session-date">Session date</label>
        <input id="session-date" type="date">
      </div>
    </div>
    <p class="hint" id="suggest-hint"></p>
    <div class="banner hidden" id="form-banner" role="status" aria-live="polite"></div>

    <div id="exercises"></div>

    <div class="block">
      <h3>How it felt</h3>
      <div class="slider-row">
        <label for="energy">Energy</label>
        <input id="energy" type="range" min="1" max="10" value="0">
        <div class="val off" id="energy-val">—</div>
      </div>
      <div class="slider-row">
        <label for="soreness">Soreness</label>
        <input id="soreness" type="range" min="1" max="10" value="0">
        <div class="val off" id="soreness-val">—</div>
      </div>
      <textarea id="session-notes" placeholder="Session notes (optional)"></textarea>
    </div>

    <div class="hist" id="history"></div>
    </div>
    <div id="tab-daily" class="hidden"></div>
    <div id="tab-weekly" class="hidden"></div>
    <div id="tab-progress" class="hidden"></div>
  </div>

  <div class="dock">
    <div class="dock-inner">
      <button type="button" id="save-btn">Save session</button>
    </div>
    <div class="status" id="save-status"></div>
  </div>
</section>

<script>
(function () {
  const API = (function () {
    if (location.hostname.endsWith('supabase.co')) {
      return location.pathname.replace(/\/$/, '').split('?')[0];
    }
    // Local testing only: allow ?api= when the page itself is served from localhost.
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      const p = new URLSearchParams(location.search).get('api');
      if (p && /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(p)) return p;
    }
    return 'https://evdszcqwdrmsjkxiuwvv.supabase.co/functions/v1/kairo-log';
  })();

  const $ = (id) => document.getElementById(id);
  let plan = null;
  let history = [];
  let suggested = null;
  let currentType = '';
  let energyTouched = false;
  let sorenessTouched = false;
  let editing = null;        // saved session currently loaded for editing
  let restoredDraft = false;
  let savedBanner = null;

  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function prettyDate(iso) {
    if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso || '';
    const [y, m, d] = iso.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    return DAYS[dt.getUTCDay()] + ' ' + d + ' ' + MONTHS[m - 1];
  }
  function todayIST() {
    return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { t.style.display = 'none'; }, 2600);
  }

  async function api(payload) {
    const headers = { 'Content-Type': 'application/json' };
    const pass = sessionStorage.getItem('kairo_pass');
    if (pass) headers['x-kairo-passcode'] = pass;
    const res = await fetch(API, { method: 'POST', headers, body: JSON.stringify(payload) });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = { error: text || 'Bad response' }; }
    if (!res.ok) {
      const err = new Error(data.error || ('HTTP ' + res.status));
      err.status = res.status;
      throw err;
    }
    return data;
  }

  async function unlock() {
    $('unlock-err').textContent = '';
    const code = $('passcode').value.trim() || sessionStorage.getItem('kairo_pass') || '';
    if (!code) { $('unlock-err').textContent = 'Enter your passcode.'; return; }
    $('unlock-btn').disabled = true;
    try {
      sessionStorage.setItem('kairo_pass', code);
      await load();
      $('unlock').classList.add('hidden');
      $('app').classList.remove('hidden');
    } catch (e) {
      sessionStorage.removeItem('kairo_pass');
      $('unlock-err').textContent = e.status === 401 ? 'Wrong passcode.' : (e.message || 'Could not unlock.');
    } finally {
      $('unlock-btn').disabled = false;
    }
  }

  async function load() {
    const data = await api({ action: 'bootstrap' });
    plan = data.plan;
    history = data.sessions || [];
    suggested = data.suggested;
    currentType = (suggested && suggested.type) || planOrder()[0];
    $('session-date').value = (suggested && suggested.date) || todayIST();
    buildSeg();
    openForm();
    trackerLoad(data);
  }

  function planOrder() {
    return (plan && Array.isArray(plan.order) && plan.order.length) ? plan.order : Object.keys((plan && plan.sessions) || {});
  }
  function legacyOrder() {
    return (plan && Array.isArray(plan.legacy_order)) ? plan.legacy_order.filter((t) => plan.legacy_sessions && plan.legacy_sessions[t]) : [];
  }
  function sessionDef(type) {
    if (!plan) return null;
    return (plan.sessions && plan.sessions[type]) || (plan.legacy_sessions && plan.legacy_sessions[type]) || null;
  }
  function buildSeg() {
    const mk = (t) => '<button type="button" data-type="' + escapeHtml(t) + '">' + escapeHtml(t) + '<span class="chip">next</span></button>';
    $('seg').innerHTML = planOrder().map(mk).join('');
    const legacy = legacyOrder();
    const lw = $('seg-legacy');
    lw.innerHTML = legacy.length ? '<span class="lbl">Old PPL</span>' + legacy.map(mk).join('') : '';
    lw.classList.toggle('hidden', !legacy.length);
    document.querySelectorAll('#seg button, #seg-legacy button').forEach((b) => {
      b.addEventListener('click', () => {
        if (b.dataset.type === currentType) return;
        saveDraft();
        currentType = b.dataset.type;
        savedBanner = null; setStatus('');
        openForm();
      });
    });
  }

  /* ---------- exercise kinds and limits ---------- */

  function kind(ex) {
    if (ex.unit === 's') return 'sec';
    if (ex.unit === 'm') return 'dist';
    if (ex.unit === 'band') return 'band';
    if (ex.target === 'bodyweight') return 'bw';
    return 'kg';
  }
  function perLabel(ex) { return ex.per ? '/' + ex.per : ''; }
  function valueUnit(ex) {
    const k = kind(ex);
    if (k === 'sec') return 'sec';
    if (k === 'dist') return 'm';
    return 'reps' + perLabel(ex);
  }
  function valueHeader(ex) {
    const k = kind(ex);
    if (k === 'sec') return 'Seconds';
    if (k === 'dist') return 'Metres';
    return 'Reps' + (ex.per ? ' per ' + ex.per : '');
  }
  function weightHeader(ex) {
    const k = kind(ex);
    if (k === 'band') return 'Band / weight';
    if (k === 'bw' || k === 'sec') return 'Added kg (blank = BW)';
    if (k === 'dist') return 'kg per hand';
    return 'Weight (kg)';
  }
  function weightUnit(ex) {
    const k = kind(ex);
    if (k === 'band') return '';
    return 'kg';
  }
  function limits(ex) {
    const k = kind(ex);
    if (k === 'sec') return { min: 1, max: 600, word: 'seconds' };
    if (k === 'dist') return { min: 1, max: 200, word: 'metres' };
    return { min: 1, max: 50, word: 'reps' };
  }
  function rangeText(ex) {
    const r = String(ex.rep_range || '').replace(/\s*s$/, '');
    const k = kind(ex);
    if (k === 'sec') return r + ' sec';
    if (k === 'dist') return r + ' m';
    return r + ' reps' + (ex.per ? ' per ' + ex.per : '');
  }
  function defaultWeightFor(ex) {
    const k = kind(ex);
    if (k === 'bw' || k === 'sec') return 'BW';
    if (k === 'band') return String(ex.target || 'light');
    return '';
  }
  function numericTarget(ex) {
    const t = ex.target;
    if (t == null || t === '') return null;
    const n = parseFloat(String(t).replace(',', '.'));
    return isFinite(n) && /^\s*\d/.test(String(t)) ? String(t) : null;
  }
  function parseNum(v) {
    const s = String(v).trim().replace(',', '.').replace(/\s*kg$/i, '');
    if (!/^\d+(\.\d+)?$/.test(s)) return null;
    return parseFloat(s);
  }

  /* ---------- history lookups ---------- */

  function realSessions() {
    return (history || []).filter((s) => !s.is_test);
  }
  function lastFor(ex, excludeKey) {
    const names = [ex.log_name, ex.name].filter(Boolean);
    const before = excludeKey ? excludeKey.split('|')[0] : '';
    for (const s of realSessions()) {
      if (before && s.session_date >= before) continue; // only sessions before the one being logged
      for (const e of s.exercises || []) {
        if (names.includes(e.name) && (e.sets || []).some((x) => (x.reps || '').trim() || parseNum(x.weight || '') != null)) {
          return { date: s.session_date, sets: e.sets };
        }
      }
    }
    return null;
  }
  function setLooksWrong(set, ex) {
    const r = String(set.reps || '').trim();
    if (!r) return true;
    const n = Number(r);
    const lim = ex ? limits(ex) : { min: 1, max: 50 };
    if (!/^\d+$/.test(r) || n < lim.min || n > lim.max) return true;
    const w = parseNum(set.weight || '');
    if (w != null && w > 400) return true;
    return false;
  }
  function fmtSet(set, ex) {
    const w = String(set.weight || '').trim();
    const r = String(set.reps || '').trim();
    const k = kind(ex);
    const wTxt = parseNum(w) != null ? w + ' kg' : (w || (k === 'kg' ? '?' : 'BW'));
    const unit = k === 'sec' ? ' s' : k === 'dist' ? ' m' : '';
    return wTxt + ' × ' + (r || '?') + unit;
  }
  function planExerciseByName(name) {
    if (!plan) return null;
    const groups = [plan.sessions || {}, plan.legacy_sessions || {}];
    for (const g of groups) {
      for (const t of Object.keys(g)) {
        for (const ex of g[t].exercises) {
          if (ex.log_name === name || ex.name === name) return ex;
        }
      }
    }
    return null;
  }
  function sessionIssues(s) {
    let n = 0;
    for (const e of s.exercises || []) {
      const ex = planExerciseByName(e.name) || { unit: e.unit };
      for (const set of e.sets || []) if (setLooksWrong(set, ex)) n++;
    }
    return n;
  }
  function savedSession(date, type) {
    return realSessions().find((s) => s.session_date === date && s.session_type === type) || null;
  }

  /* ---------- rendering ---------- */

  function openForm(opts) {
    opts = opts || {};
    energyTouched = false; sorenessTouched = false;
    $('energy').value = 5; $('soreness').value = 5;
    setSlider('energy', null); setSlider('soreness', null);
    $('session-notes').value = '';
    editing = null;
    restoredDraft = false;
    render();
    const date = $('session-date').value;
    const saved = savedSession(date, currentType);
    if (opts.fromHistory && saved) {
      clearDraft();
      fillFrom(saved);
      editing = saved;
    } else if (restoreDraft()) {
      restoredDraft = true;
      if (saved) editing = saved;
    } else if (saved) {
      fillFrom(saved);
      editing = saved;
    }
    refreshAll();
    renderBanner();
  }

  function setSlider(id, v) {
    const val = $(id + '-val');
    if (v == null) { val.textContent = '—'; val.classList.add('off'); return; }
    $(id).value = v; val.textContent = v; val.classList.remove('off');
  }

  function render() {
    document.querySelectorAll('#seg button, #seg-legacy button').forEach((b) => {
      b.classList.toggle('on', b.dataset.type === currentType);
      b.classList.toggle('suggested', !!(suggested && suggested.type === b.dataset.type));
    });
    const sess = sessionDef(currentType);
    const why = suggested && suggested.type === currentType ? suggested.reason : (sess ? ('Default ' + sess.default_day) : '');
    $('suggest-hint').innerHTML = sess
      ? '<strong>' + currentType + '</strong> · ' + escapeHtml(sess.subtitle) + (why ? ' · ' + escapeHtml(why) : '')
      : '';
    const root = $('exercises');
    root.innerHTML = '';
    const key = $('session-date').value + '|' + currentType;
    (sess ? sess.exercises : []).forEach((ex, i) => root.appendChild(exerciseCard(ex, i, key)));
    renderHistory();
  }

  function exerciseCard(ex, idx, key) {
    const el = document.createElement('article');
    el.className = 'ex';
    el.dataset.idx = idx;
    const k = kind(ex);
    const last = lastFor(ex, key);
    const tgt = numericTarget(ex);
    let lastHtml;
    if (tgt) {
      lastHtml = 'Target: <b>' + escapeHtml(tgt) + ' kg</b>';
      if (last) lastHtml += ' · Last ' + escapeHtml(prettyDate(last.date)) + ': ' + escapeHtml(last.sets.map((s) => fmtSet(s, ex)).join(', '));
    } else if (last) {
      const bad = last.sets.some((s) => setLooksWrong(s, ex));
      lastHtml = 'Last ' + escapeHtml(prettyDate(last.date)) + ': <b>' + escapeHtml(last.sets.map((s) => fmtSet(s, ex)).join(', ')) + '</b>' +
        (bad ? ' <span class="warnt">· looks wrong, fix in history</span>' : '');
    } else if (k === 'band') {
      lastHtml = 'Light band or plate. Add reps before weight.';
    } else if (k === 'bw' || k === 'sec') {
      lastHtml = 'Bodyweight. Leave weight blank unless you add load.';
    } else {
      lastHtml = 'No history yet. Find your load at 3 RIR: a weight you could lift for 3 more reps at the top of the range.';
    }
    // Suggestions only from sensible previous sets
    const sugg = last && !last.sets.some((s) => setLooksWrong(s, ex)) ? last.sets : [];
    let setsHtml = '<div class="set-head"><div></div><div>' + escapeHtml(weightHeader(ex)) + '</div><div></div><div>' + escapeHtml(valueHeader(ex)) + '</div></div>';
    const lim = limits(ex);
    for (let s = 1; s <= ex.sets; s++) {
      const sg = sugg[s - 1] || sugg[sugg.length - 1];
      const wPh = sg && parseNum(sg.weight || '') != null ? String(sg.weight) : (k === 'band' ? String(ex.target || 'light') : (k === 'bw' || k === 'sec') ? 'BW' : '–');
      const rPh = sg && sg.reps ? String(sg.reps) : rangeText(ex).replace(' reps', '').replace(' per ', '/');
      const wMode = k === 'band' ? 'inputmode="text" autocapitalize="off"' : 'inputmode="decimal"';
      setsHtml += '<div class="set" data-s="' + s + '">' +
        '<div class="n">SET ' + s + '</div>' +
        '<div class="inp"><input data-f="w" data-s="' + s + '" ' + wMode + ' enterkeyhint="next" placeholder="' + escapeHtml(wPh) + '" autocomplete="off" aria-label="Set ' + s + ' ' + escapeHtml(weightHeader(ex)) + '"><span class="u">' + weightUnit(ex) + '</span></div>' +
        '<div class="times">×</div>' +
        '<div class="inp"><input data-f="r" data-s="' + s + '" inputmode="numeric" pattern="[0-9]*" enterkeyhint="next" placeholder="' + escapeHtml(rPh) + '" autocomplete="off" aria-label="Set ' + s + ' ' + escapeHtml(valueHeader(ex)) + ' (' + lim.min + '–' + lim.max + ')"><span class="u">' + escapeHtml(valueUnit(ex)) + '</span></div>' +
        '</div><div class="set-msg" data-msg="' + s + '"></div>';
    }
    const range = ex.sets + ' sets × ' + rangeText(ex) + ' · rest ' + ex.rest;
    el.innerHTML =
      '<div class="ex-head"><div class="ex-name">' + escapeHtml(ex.name) + '</div></div>' +
      '<div class="ex-meta">' + escapeHtml(range) + '</div>' +
      '<div class="ex-last">' + lastHtml + '</div>' +
      '<div class="ex-tools">' +
        (sugg.length ? '<button type="button" class="mini" data-act="last">Use last</button>' : '') +
        (ex.sets > 1 ? '<button type="button" class="mini" data-act="copy">Copy set 1 to all</button>' : '') +
        '<button type="button" class="mini" data-act="clear">Clear</button>' +
      '</div>' +
      setsHtml +
      '<textarea class="ex-notes" placeholder="Notes (optional)" rows="1"></textarea>';

    el.addEventListener('input', (e) => {
      const t = e.target;
      if (t.dataset && t.dataset.f) {
        t.parentElement.classList.remove('auto');
        t.dataset.auto = '';
        if (t.dataset.f === 'w') autoFillDown(el, Number(t.dataset.s));
      }
      dirty();
      refreshCard(el, ex);
    });
    el.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => {
      const act = b.dataset.act;
      const ws = [...el.querySelectorAll('input[data-f="w"]')];
      const rs = [...el.querySelectorAll('input[data-f="r"]')];
      if (act === 'copy') {
        for (let i = 1; i < ws.length; i++) { ws[i].value = ws[0].value; rs[i].value = rs[0].value; ws[i].dataset.auto = ''; ws[i].parentElement.classList.remove('auto'); }
      } else if (act === 'last') {
        for (let i = 0; i < ws.length; i++) {
          const sg = sugg[i] || sugg[sugg.length - 1];
          if (!sg) continue;
          ws[i].value = sg.weight && parseNum(sg.weight) != null ? sg.weight : (k === 'kg' ? '' : '');
          rs[i].value = sg.reps || '';
          ws[i].dataset.auto = '';
          ws[i].parentElement.classList.remove('auto');
        }
      } else if (act === 'clear') {
        ws.concat(rs).forEach((n) => { n.value = ''; n.dataset.auto = ''; n.parentElement.classList.remove('auto'); });
      }
      dirty();
      refreshCard(el, ex);
    }));
    el.querySelector('.ex-notes').addEventListener('input', dirty);
    return el;
  }

  function autoFillDown(card, fromSet) {
    const ws = [...card.querySelectorAll('input[data-f="w"]')];
    const src = ws[fromSet - 1];
    for (let i = fromSet; i < ws.length; i++) {
      const w = ws[i];
      if (w.value.trim() && w.dataset.auto !== '1') break; // never overwrite typed values
      w.value = src.value;
      w.dataset.auto = src.value ? '1' : '';
      w.parentElement.classList.toggle('auto', !!src.value);
    }
  }

  /* ---------- validation ---------- */

  function checkSet(ex, wRaw, rRaw, wAuto) {
    const k = kind(ex);
    const w = String(wRaw || '').trim();
    const r = String(rRaw || '').trim();
    const lim = limits(ex);
    const out = { state: 'empty', msg: '', bad: false, wBad: false, rBad: false };
    if (!w && !r) return out;
    if (!r && wAuto) return out; // auto-filled weight on an unused set is ignored
    if (r) {
      if (!/^\d+$/.test(r)) { out.rBad = true; out.msg = lim.word[0].toUpperCase() + lim.word.slice(1) + ' must be a whole number.'; }
      else {
        const n = Number(r);
        if (n < lim.min || n > lim.max) {
          out.rBad = true;
          out.msg = n + ' ' + lim.word + '? Must be ' + lim.min + '–' + lim.max + '.' + (k !== 'sec' && k !== 'dist' && n > lim.max ? ' Did you swap kg and reps?' : '');
        }
      }
    } else {
      out.rBad = true;
      out.msg = 'Add the ' + lim.word + ' for this set, or clear the weight.';
    }
    if (w && k !== 'band') {
      const upper = w.toUpperCase();
      const num = parseNum(w);
      if (upper === 'BW' && k !== 'kg' && k !== 'dist') { /* ok */ }
      else if (num == null) { out.wBad = true; out.msg = (out.msg ? out.msg + ' ' : '') + 'Weight must be a number in kg, e.g. 40 or 22.5.'; }
      else if (num > 400) { out.wBad = true; out.msg = (out.msg ? out.msg + ' ' : '') + num + ' kg? Must be 0–400.'; }
      else if (num > 0 && r && /^\d+$/.test(r) && Number(r) > 0 && num < 1 && k === 'kg') { /* tiny weights allowed */ }
    } else if (w && k === 'band' && w.length > 20) {
      out.wBad = true; out.msg = (out.msg ? out.msg + ' ' : '') + 'Keep the band note short (e.g. light, red, 5 kg).';
    }
    out.bad = out.wBad || out.rBad;
    if (!out.bad && !w && (k === 'kg' || k === 'dist')) {
      out.warn = 'No weight entered. Add the kg so I can track progress.';
    }
    if (!out.bad && k === 'kg' && r && Number(r) > 0 && parseNum(w) != null && Number(r) > 30) {
      out.warn = Number(r) + ' reps is a lot for this rep range. Check it.';
    }
    out.state = out.bad ? 'bad' : 'done';
    return out;
  }

  function refreshCard(card, ex) {
    if (!ex) ex = sessionDef(currentType).exercises[Number(card.dataset.idx)];
    let anyBad = false;
    for (let s = 1; s <= ex.sets; s++) {
      const w = card.querySelector('input[data-f="w"][data-s="' + s + '"]');
      const r = card.querySelector('input[data-f="r"][data-s="' + s + '"]');
      const row = card.querySelector('.set[data-s="' + s + '"]');
      const msg = card.querySelector('[data-msg="' + s + '"]');
      const c = checkSet(ex, w.value, r.value, w.dataset.auto === '1');
      w.parentElement.classList.toggle('filled', !!w.value.trim());
      r.parentElement.classList.toggle('filled', !!r.value.trim());
      w.parentElement.classList.toggle('bad', c.wBad);
      r.parentElement.classList.toggle('bad', c.rBad);
      row.classList.toggle('done', c.state === 'done');
      row.querySelector('.n').textContent = (c.state === 'done' ? '✓ ' : 'SET ') + s;
      msg.textContent = c.msg || c.warn || '';
      msg.className = 'set-msg' + (c.msg ? ' bad' : c.warn ? ' warn' : '');
      if (c.bad) anyBad = true;
    }
    card.classList.toggle('has-err', anyBad);
    return anyBad;
  }
  function refreshAll() {
    document.querySelectorAll('#exercises .ex').forEach((c) => refreshCard(c));
  }

  /* ---------- collect / fill ---------- */

  function collect() {
    const sess = sessionDef(currentType);
    const cards = [...document.querySelectorAll('#exercises .ex')];
    const problems = [];
    const exercises = sess.exercises.map((ex, i) => {
      const card = cards[i];
      const sets = [];
      for (let s = 1; s <= ex.sets; s++) {
        const wi = card.querySelector('input[data-f="w"][data-s="' + s + '"]');
        const ri = card.querySelector('input[data-f="r"][data-s="' + s + '"]');
        let weight = (wi.value || '').trim().replace(',', '.').replace(/\s*kg$/i, '');
        const reps = (ri.value || '').trim();
        const c = checkSet(ex, weight, reps, wi.dataset.auto === '1');
        if (c.state === 'empty') continue;
        if (c.bad) problems.push({ card, text: ex.name + ' · set ' + s + ': ' + c.msg });
        if (!weight) weight = defaultWeightFor(ex);
        if (/^bw$/i.test(weight)) weight = 'BW';
        sets.push({ weight, reps });
      }
      const notes = (card.querySelector('.ex-notes').value || '').trim();
      return { name: ex.log_name || ex.name, unit: ex.unit || 'kg', per: ex.per || null, sets, notes };
    });
    return {
      payload: {
        action: 'save',
        session_date: $('session-date').value,
        session_type: currentType,
        exercises,
        energy: energyTouched ? Number($('energy').value) : null,
        soreness: sorenessTouched ? Number($('soreness').value) : null,
        notes: $('session-notes').value.trim(),
      },
      problems,
    };
  }

  function fillFrom(s) {
    const sess = sessionDef(currentType);
    const cards = [...document.querySelectorAll('#exercises .ex')];
    sess.exercises.forEach((ex, i) => {
      const saved = (s.exercises || []).find((e) => e.name === (ex.log_name || ex.name) || e.name === ex.name);
      const card = cards[i];
      if (!saved || !card) return;
      (saved.sets || []).forEach((set, si) => {
        const w = card.querySelector('input[data-f="w"][data-s="' + (si + 1) + '"]');
        const r = card.querySelector('input[data-f="r"][data-s="' + (si + 1) + '"]');
        if (!w || !r) return;
        const wv = String(set.weight || '');
        // Don't show the old automatic "light"/"BW" fill-ins as typed values when no reps were entered.
        w.value = (!set.reps && (wv === 'light' || wv === 'BW')) ? '' : wv;
        r.value = set.reps || '';
      });
      if (saved.notes) card.querySelector('.ex-notes').value = saved.notes;
    });
    if (s.energy != null) { energyTouched = true; setSlider('energy', s.energy); }
    if (s.soreness != null) { sorenessTouched = true; setSlider('soreness', s.soreness); }
    $('session-notes').value = s.notes || '';
  }

  /* ---------- drafts ---------- */

  function draftKey() { return 'kairo_draft2_' + currentType + '_' + ($('session-date').value || ''); }
  function oldDraftKey() { return 'kairo_draft_' + currentType + '_' + ($('session-date').value || ''); }
  function grid() {
    return [...document.querySelectorAll('#exercises .ex')].map((card) => ({
      sets: [...card.querySelectorAll('input[data-f="w"]')].map((w, i) => {
        const r = card.querySelectorAll('input[data-f="r"]')[i];
        return [w.value, r.value, w.dataset.auto === '1' ? 1 : 0];
      }),
      notes: card.querySelector('.ex-notes').value,
    }));
  }
  function saveDraft() {
    try {
      localStorage.setItem(draftKey(), JSON.stringify({
        v: 2, type: currentType, grid: grid(),
        energy: energyTouched ? Number($('energy').value) : null,
        soreness: sorenessTouched ? Number($('soreness').value) : null,
        notes: $('session-notes').value, at: Date.now(),
      }));
    } catch (e) {}
  }
  function clearDraft() {
    try { localStorage.removeItem(draftKey()); localStorage.removeItem(oldDraftKey()); } catch (e) {}
  }
  function restoreDraft() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(draftKey()) || 'null'); } catch (e) { d = null; }
    const cards = [...document.querySelectorAll('#exercises .ex')];
    let any = false;
    if (d && d.v === 2 && d.type === currentType) {
      (d.grid || []).forEach((g, i) => {
        const card = cards[i]; if (!card) return;
        (g.sets || []).forEach(([wv, rv, auto], si) => {
          const w = card.querySelector('input[data-f="w"][data-s="' + (si + 1) + '"]');
          const r = card.querySelector('input[data-f="r"][data-s="' + (si + 1) + '"]');
          if (!w || !r) return;
          w.value = wv || ''; r.value = rv || '';
          if (auto) { w.dataset.auto = '1'; w.parentElement.classList.add('auto'); }
          if (rv) any = true; else if (wv && !auto) any = true;
        });
        if (g.notes) { card.querySelector('.ex-notes').value = g.notes; any = true; }
      });
    } else {
      // Old-format draft: only real reps count; old auto-prefilled weights are dropped.
      let o = null;
      try { o = JSON.parse(localStorage.getItem(oldDraftKey()) || 'null'); } catch (e) { o = null; }
      if (o && o.session_type === currentType) {
        (o.exercises || []).forEach((ex, i) => {
          const card = cards[i]; if (!card) return;

  /* ---------- progress dashboard ---------- */
  function topSet(sets) {

  }
  function weightChart(today) {

    svg += '<polygon points="' + X(band[0][0]) + ',' + Y(band[0][1]) + ' ' + X(band[1][0]) + ',' + Y(band[1][1]) + ' ' + X(band[1][0]) + ',' + Y(band[1][2]) + ' ' + X(band[0][0]) + ',' + Y(band[0][2]) + '" fill="#3dbe9a" fill-opacity="0.12" stroke="#3dbe9a" stroke-opacity="0.35" stroke-dasharray="3 3"/>';
    svg += '<rect x="' + X(dAdd(R90.end, -6)) + '" width="' + (X(R90.end) - X(dAdd(R90.end, -6))) + '" y="' + Y(R90.targetHi) + '" height="' + (Y(R90.targetLo) - Y(R90.targetHi)) + '" fill="#e6b84d" fill-opacity="0.35"/>';
    svg += '<line x1="' + X(R90.start) + '" x2="' + X(R90.start) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="#5c6678" stroke-dasharray="2 3"/>';
    if (today >= from && today <= to) svg += '<line x1="' + X(today) + '" x2="' + X(today) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="#8b95a8" stroke-opacity="0.5"/>';

    // assessment summary
    const w1 = weekStats(1);
    const cur = wNow >= 2 ? weekStats(Math.min(wNow, 12)) : null;
    const cmp = (label, a, b, unit, dp, better) => {
      if (a == null) return row(label, nd(), 'week 1');
      if (b == null) return row(label, fmt(a, dp) + unit, 'week 1 only');
      const d = b - a; const cls = better === 0 ? '' : (better < 0 ? d <= 0 : d >= 0) ? 'ok' : 'warnc';
      return row(label, fmt(b, dp) + unit, 'wk 1 ' + fmt(a, dp) + ' (' + (d >= 0 ? '+' : '') + fmt(d, dp) + ')', cls);
    };
    const nextAssess = ASSESS.find((a) => a[1] >= today);
    const waist1 = waist.find((r) => r.entry_date >= R90.start && r.entry_date <= dAdd(R90.start, 6)) || null;
    const waistL = waist.length ? waist[waist.length - 1] : null;
    html += '<div class="tk-card"><h3>Assessment summary' + (nextAssess ? ' · next ' + nextAssess[0] + ', ' + escapeHtml(prettyDate(nextAssess[1]).slice(4)) : '') + '</h3>' +
      '<div class="sub" style="margin-bottom:8px">Current week compared with the week-1 baseline (24–30 Nov). Fills in as data arrives.</div><div class="kv">' +
      cmp('Weight avg', w1.weight, cur && cur.weight, ' kg', 1, -1) +
      cmp('Waist', waist1 ? Number(waist1.waist_cm) : null, waistL && waist1 && waistL.entry_date > waist1.entry_date ? Number(waistL.waist_cm) : null, ' cm', 1, -1) +
      cmp('Steps', w1.steps, cur && cur.steps, '', 0, 1) +
      cmp('Sleep', w1.sleep, cur && cur.sleep, ' h', 1, 1) +
      cmp('Protein', w1.protein, cur && cur.protein, ' g', 0, 1) +
      lifts.filter((l) => l.h.length).slice(0, 4).map((l) => {
        const base = l.h.filter((x) => x.date <= dAdd(R90.start, 13))[0];
        const z = l.h[l.h.length - 1];
        return base ? cmp(escapeHtml(l.n) + ' e1RM*', base.e, z.date > base.date ? z.e : null, ' kg', 1, 1) : '';
      }).join('') + '</div></div>';
    if (tHealth && tHealth.rows && tHealth.rows.length) html += '<p class="hint">“w/s” and hollow dots = from watch/scale (Google Health sync, updated ' + escapeHtml(String(tHealth.updated || '').slice(0, 10)) + '), shown only for days without your own check-in value.</p>';
    root.innerHTML = html;
  }

  if (sessionStorage.getItem('kairo_pass')) unlock();
})();
</script>
